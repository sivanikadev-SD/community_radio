<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SonicStream</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='2'%3E%3C/circle%3E%3Cpath d='M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14'%3E%3C/path%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='2'%3E%3C/circle%3E%3Cpath d='M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14'%3E%3C/path%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <!-- Navigation -->
    <div style="position: absolute; top: 2rem; left: 2rem; z-index: 100;">
        <a href="../index.html" class="btn btn-glass" style="padding: 0.5rem 1rem;"><i data-lucide="arrow-left"></i> Home</a>
    </div>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-header" style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                <a href="../index.html" class="logo" style="margin-bottom: 2rem; font-size: 2rem;">
                    <i data-lucide="radio" style="width: 32px; height: 32px;"></i>
                    STREAM
                </a>
                <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Welcome <span>Back</span></h1>
                <p style="color: var(--text-muted);">Enter your frequency to continue</p>
            </div>
            <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; justify-content: space-between; align-items: center;">
                <button class="btn btn-glass" style="flex: 1; padding: 0.8rem; display: inline-flex; justify-content: center; align-items: center;">
                    <i data-lucide="chrome" style="width: 18px; height: 18px;"></i>
                </button>
                <button class="btn btn-glass" style="flex: 1; padding: 0.8rem; display: inline-flex; justify-content: center; align-items: center;">
                    <i data-lucide="facebook" style="width: 18px; height: 18px;"></i>
                </button>
                <button class="btn btn-glass" style="flex: 1; padding: 0.8rem; display: inline-flex; justify-content: center; align-items: center;">
                    <i data-lucide="apple" style="width: 18px; height: 18px;"></i>
                </button>
            </div>
            <div style="display: flex; align-items: center; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
                <hr style="flex: 1; border-color: var(--border); opacity: 0.5;">
                <span style="padding: 0 1rem;">or continue with email</span>
                <hr style="flex: 1; border-color: var(--border); opacity: 0.5;">
            </div>
            <form class="auth-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="dj@sonicstream.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem; flex-wrap: nowrap; white-space: nowrap;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; margin: 0;">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary); font-weight: 700; margin-left: 1rem;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-full" style="padding: 1rem;">Sign In <i
                        data-lucide="arrow-right"></i></button>
            </form>
            <div class="auth-footer">
                <p>New to the platform? <a href="signup.html">Create an Account</a></p>
            </div>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
