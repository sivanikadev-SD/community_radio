<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Frequency Lost | SonicStream</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='2'%3E%3C/circle%3E%3Cpath d='M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14'%3E%3C/path%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden;">

    <div class="container animate-in">
        <h1
            style="font-size: 10rem; margin: 0; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1;">
            404</h1>
        <h2 style="font-size: 2.5rem; margin-bottom: 2rem;">Oops! You're out of range.</h2>
        <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 3rem; font-size: 1.1rem;">The frequency
            you're looking for has moved or disconnected. Let's get you back to the main stage.</p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="../index.html" class="btn btn-primary">Back to Home <i data-lucide="home"></i></a>
            <a href="contact.html" class="btn btn-glass">Contact Support</a>
        </div>
    </div>

    <!-- Background Decoration -->
    <div
        style="position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%); top: -200px; left: -200px; z-index: -1;">
    </div>
    <div
        style="position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, var(--secondary-glow) 0%, transparent 70%); bottom: -200px; right: -200px; z-index: -1;">
    </div>

    <script src="../assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
