<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicStream | Tune In Soon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='2'%3E%3C/circle%3E%3Cpath d='M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14'%3E%3C/path%3E%3C/svg%3E">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .timer-grid {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin: 4rem 0;
        }

        .timer-unit {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            min-width: 140px;
        }

        .timer-val {
            display: block;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .timer-label {
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-muted);
        }
    </style>
</head>

<body
    style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-main) 100%);">

    <div class="container animate-in">
        <div class="logo" style="justify-content: center; font-size: 2.5rem; margin-bottom: 3rem;">
            <i data-lucide="radio"></i>
            SONIC<span>STREAM</span>
        </div>
        <h1 style="font-size: 5rem; margin-bottom: 2rem;">The Pulse is <span>Starting Soon</span></h1>
        <p style="color: var(--text-muted); max-width: 600px; margin: 0 auto; font-size: 1.25rem;">We're tuning our
            global frequencies to give you the ultimate radio experience. Join the waitlist for early access.</p>

        <div class="timer-grid">
            <div class="timer-unit"><span class="timer-val">12</span><span class="timer-label">Days</span></div>
            <div class="timer-unit"><span class="timer-val">08</span><span class="timer-label">Hours</span></div>
            <div class="timer-unit"><span class="timer-val">45</span><span class="timer-label">Mins</span></div>
        </div>

        <form style="display: flex; gap: 1rem; max-width: 500px; margin: 0 auto;" class="auth-form">
            <input type="email" placeholder="Enter your email" required
                style="flex: 1; padding: 1rem; border-radius: var(--radius-md); background: var(--glass-bg); border: 1px solid var(--border); color: white;">
            <button type="submit" class="btn btn-primary">Notify Me <i data-lucide="send"></i></button>
        </form>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
